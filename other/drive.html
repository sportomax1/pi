<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drive Scout | Autonomous Route Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--accent:#30d158;--blue:#0a84ff;--red:#ff453a;--amber:#ffd60a;--bg:#020617;--panel:rgba(15,23,42,.86);--panel2:rgba(2,6,23,.72);--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.1);--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
    *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;overflow:hidden} button{font:inherit}
    #map{position:fixed;inset:0;z-index:0;filter:brightness(.78) contrast(1.08) saturate(.95)}
    .glass{background:var(--panel);border:1px solid var(--border);box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
    .top-nav{position:fixed;z-index:1000;top:calc(14px + var(--safe-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;max-width:calc(100vw - 24px)}
    .btn{border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);border-radius:14px;padding:10px 12px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}.btn:active{transform:scale(.98)}.btn.active{background:rgba(48,209,88,.16);border-color:rgba(48,209,88,.45);color:#bbf7d0}.btn-danger{background:rgba(255,69,58,.18);border-color:rgba(255,69,58,.45);color:#fecaca}.btn-primary{background:var(--accent);border:0;color:#001b08}
    .analytics-panel{position:fixed;z-index:1001;left:18px;top:86px;width:230px;padding:18px;border-radius:24px}.panel-title{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.stat-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}.stat-row:last-child{border:0}.stat-count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);font-weight:900}.stat-ratio{font-size:9px;color:var(--muted)}
    .log-panel{position:fixed;z-index:1001;right:18px;top:86px;bottom:18px;width:360px;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease}.log-panel.collapsed{transform:translateX(calc(100% - 54px))}.log-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}.log-header h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}.mini-log{position:absolute;left:0;top:0;bottom:0;width:54px;display:none;align-items:center;justify-content:center;writing-mode:vertical-rl;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--accent);cursor:pointer}.collapsed .mini-log{display:flex}.collapsed .log-header,.collapsed .log-container{opacity:0;pointer-events:none}.log-container{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column-reverse;gap:8px}.log-entry{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.45;color:var(--muted);border-left:2px solid transparent;padding:6px 0 6px 10px}.log-entry.active{color:#fff;border-left-color:var(--accent);background:rgba(48,209,88,.07)}.log-entry.future{color:#93c5fd;border-left-color:var(--blue)}.log-entry.warn{color:#fde68a;border-left-color:var(--amber)}.log-entry.err{color:#fecaca;border-left-color:var(--red)}.coords{display:block;color:#64748b;margin-top:2px}
    .bottom-panel{position:fixed;z-index:1000;left:50%;bottom:calc(16px + var(--safe-bottom));transform:translateX(-50%);width:min(560px,calc(100vw - 24px));border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:12px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:10px;text-align:center}.stat-label{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:4px}.stat-value{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}.controls-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drive-btn{border:0;border-radius:18px;padding:15px;font-size:13px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:var(--accent);color:#001b08}.drive-btn.stop{background:var(--red);color:#fff}.drive-btn.secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--border)}
    .loading-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}.loading-card{width:min(420px,92vw);border-radius:28px;padding:26px}.loading-card h1{margin:8px 0 8px;font-size:22px}.loading-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.hidden{display:none!important}.car-icon{background:transparent;border:0}.leaflet-control-attribution{display:none}
    @media(max-width:900px){.analytics-panel{display:none}.top-nav{top:calc(10px + var(--safe-top));width:calc(100vw - 20px);overflow-x:auto;justify-content:flex-start}.top-nav::-webkit-scrollbar{display:none}.btn{padding:9px 11px}.log-panel{left:10px;right:10px;top:auto;bottom:calc(188px + var(--safe-bottom));width:auto;height:118px;border-radius:20px}.log-panel.collapsed{transform:translateY(calc(100% - 38px))}.mini-log{width:100%;height:38px;writing-mode:horizontal-tb}.collapsed .mini-log{display:flex}.bottom-panel{bottom:calc(10px + var(--safe-bottom));width:calc(100vw - 20px);padding:12px;border-radius:22px}.stats-grid{grid-template-columns:repeat(2,1fr)}.stat-box{padding:9px}.stat-value{font-size:14px}.controls-row{grid-template-columns:1fr}.drive-btn{padding:14px}#map{height:100svh}}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="top-nav glass">
    <button class="btn" onclick="zoomMap(-1)">−</button><span id="zoomLevel" class="btn" style="cursor:default;min-width:48px;text-align:center">18</span><button class="btn" onclick="zoomMap(1)">+</button>
    <button class="btn active" id="followBtn" onclick="toggleFollow()">View Lock</button><button class="btn" onclick="recenter()">Center</button><button class="btn" onclick="clearTrail()">Clear Trail</button>
  </div>
  <aside class="analytics-panel glass">
    <div class="panel-title">Decision Stats</div>
    <div class="stat-row"><span>Straight</span><span class="stat-count" id="stat-Straight">0 <span class="stat-ratio">/ 0</span></span></div>
    <div class="stat-row"><span>Left Turn</span><span class="stat-count" id="stat-Left">0 <span class="stat-ratio">/ 0</span></span></div>
    <div class="stat-row"><span>Right Turn</span><span class="stat-count" id="stat-Right">0 <span class="stat-ratio">/ 0</span></span></div>
    <div class="stat-row"><span>U-Turn</span><span class="stat-count" id="stat-UTurn">0 <span class="stat-ratio">/ 0</span></span></div>
    <div class="stat-row"><span>Other</span><span class="stat-count" id="stat-Other">0 <span class="stat-ratio">/ 0</span></span></div>
    <div class="panel-title" style="margin-top:14px">Trip</div>
    <div class="stat-row"><span>Total Legs</span><span class="stat-count" id="stat-Total">0</span></div>
    <div class="stat-row"><span>Visited Points</span><span class="stat-count" id="stat-Visited">0</span></div>
  </aside>
  <aside class="log-panel glass" id="logPanel">
    <div class="mini-log" onclick="toggleLog()">Mission Log</div>
    <div class="log-header" onclick="toggleLog()"><h2>Mission Log</h2><div id="toggleIcon">➡️</div></div>
    <div class="log-container" id="driveLog"></div>
  </aside>
  <section class="bottom-panel glass" id="ui" style="display:none">
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">Odometer</div><div class="stat-value" id="odoVal">0.00 mi</div></div>
      <div class="stat-box"><div class="stat-label">Compass</div><div class="stat-value" id="dirVal">--</div></div>
      <div class="stat-box"><div class="stat-label">To Junction</div><div class="stat-value" id="distVal">-- ft</div></div>
      <div class="stat-box"><div class="stat-label">Buffer</div><div class="stat-value" id="bufVal" style="color:var(--accent)">0/8</div></div>
    </div>
    <div class="controls-row"><button class="drive-btn" id="driveBtn">Engage Autonomy</button><button class="drive-btn secondary" id="resetBtn">Reset Trip</button></div>
  </section>
  <div id="loader" class="loading-overlay"><div class="loading-card glass"><div style="font-size:44px">🚙</div><h1>Drive Scout</h1><p id="loaderText">Getting your location and warming up the route brain...</p><button class="drive-btn secondary hidden" id="retryBtn" style="margin-top:16px">Retry Location</button></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CONFIG={simMetersPerSecond:18,maxBuffer:8,probeMeters:520,scanAngles:[0,35,-35,70,-70,110,-110,180],routeTimeoutMs:6000,recentPointLimit:350};
    let map,carMarker,activePath,trail,isDriving=false,autoFollow=true,currentPos=null,currentBearing=0,totalMeters=0,activeLeg=null,pathQueue=[],isThinking=false,lastFrameTime=null,routeRequestId=0;
    const visited=[]; const analytics={Straight:{taken:0,possible:0},Left:{taken:0,possible:0},Right:{taken:0,possible:0},UTurn:{taken:0,possible:0},Other:{taken:0,possible:0},Total:0};
    map=L.map('map',{zoomSnap:.1,zoomControl:false,attributionControl:false}).setView([39.5186,-104.7614],15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
    map.on('dragstart',()=>{if(autoFollow)toggleFollow(false)});
    const carIcon=L.divIcon({html:'<div id="car" style="font-size:34px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55));transition:transform .08s linear">🚙</div>',className:'car-icon',iconSize:[42,42],iconAnchor:[21,21]});
    const $=id=>document.getElementById(id);
    function log(msg,type='',coords=null){const el=$('driveLog'); if(!el)return; const entry=document.createElement('div'); entry.className='log-entry '+type; const time=new Date().toLocaleTimeString([],{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}); const c=coords||currentPos; entry.innerHTML=`[${time}] ${msg}${c?`<span class="coords">LAT ${c[0].toFixed(6)} · LON ${c[1].toFixed(6)}</span>`:''}`; el.insertBefore(entry,el.firstChild); while(el.children.length>120)el.removeChild(el.lastChild);}
    function updateAnalyticsUI(){Object.keys(analytics).forEach(k=>{if(k==='Total')return; const el=$('stat-'+k); if(el)el.innerHTML=`${analytics[k].taken} <span class="stat-ratio">/ ${analytics[k].possible}</span>`}); $('stat-Total').innerText=analytics.Total; $('stat-Visited').innerText=visited.length;}
    function setLoading(message,showRetry=false){$('loaderText').textContent=message; $('retryBtn').classList.toggle('hidden',!showRetry); $('loader').classList.remove('hidden')}
    function hideLoading(){ $('loader').classList.add('hidden'); $('ui').style.display='flex'; }
    function initLocation(){setLoading('Getting your location and warming up the route brain...'); if(!navigator.geolocation){setLoading('This browser does not support geolocation. Open in Safari/Chrome with location enabled.',true);return;} navigator.geolocation.getCurrentPosition(p=>{currentPos=[p.coords.latitude,p.coords.longitude]; map.setView(currentPos,18); carMarker=L.marker(currentPos,{icon:carIcon}).addTo(map); trail=L.polyline([currentPos],{color:'#30d158',weight:4,opacity:.55}).addTo(map); visited.push(currentPos); $('zoomLevel').innerText=Math.round(map.getZoom()); hideLoading(); log('Systems online. Ready to explore.','active'); fillRouteBuffer();},err=>{const msg=err.code===1?'Location permission denied. Allow location access to start the drive simulator.':'Location unavailable. Try again when GPS/network location is ready.'; setLoading(msg,true); log(msg,'err');},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});}
    $('retryBtn').onclick=initLocation;
    function destinationFrom(origin,bearingDeg,meters){const R=6378137,brng=bearingDeg*Math.PI/180,lat1=origin[0]*Math.PI/180,lon1=origin[1]*Math.PI/180,d=meters/R; const lat2=Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(brng)); const lon2=lon1+Math.atan2(Math.sin(brng)*Math.sin(d)*Math.cos(lat1),Math.cos(d)-Math.sin(lat1)*Math.sin(lat2)); return [lat2*180/Math.PI,lon2*180/Math.PI];}
    function bearingBetween(a,b){const lat1=a[0]*Math.PI/180,lat2=b[0]*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180; const y=Math.sin(dLon)*Math.cos(lat2),x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon); return (Math.atan2(y,x)*180/Math.PI+360)%360;}
    function angleDiff(a,b){return ((a-b+540)%360)-180}
    function getCategory(angle){const abs=Math.abs(angle); if(abs<25)return'Straight'; if(angle>=25&&angle<=125)return'Right'; if(angle<=-25&&angle>=-125)return'Left'; if(abs>140)return'UTurn'; return'Other'}
    function routeSignature(coords){return coords.slice(0,Math.min(coords.length,8)).map(c=>`${c[0].toFixed(4)},${c[1].toFixed(4)}`).join('|')}
    function nearVisited(coord){return visited.some(v=>map.distance(v,coord)<35)}
    function fetchWithTimeout(url,ms){const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),ms); return fetch(url,{signal:ctrl.signal}).finally(()=>clearTimeout(t));}
    async function scanRoute(origin,bearing,angle){const dest=destinationFrom(origin,bearing+angle,CONFIG.probeMeters); const url=`https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&steps=true`; try{const res=await fetchWithTimeout(url,CONFIG.routeTimeoutMs); const data=await res.json(); const route=data.routes?.[0]; if(!route)return null; const coords=route.geometry.coordinates.map(c=>[c[1],c[0]]).filter(Boolean); if(coords.length<2)return null; const exitBearing=bearingBetween(coords[Math.max(0,coords.length-3)],coords[coords.length-1]); const finalAngle=angleDiff(exitBearing,bearing); const maneuver=route.legs?.[0]?.steps?.[1]?.maneuver; const instruction=maneuver?.instruction||route.legs?.[0]?.summary||'Continue'; return {category:getCategory(finalAngle),coords,instruction,exitBearing,angle:finalAngle,distance:route.distance,signature:routeSignature(coords),loopRisk:nearVisited(coords[coords.length-1])};}catch(e){return null}}
    async function fillRouteBuffer(){if(isThinking||!currentPos||pathQueue.length>=CONFIG.maxBuffer)return; const requestId=++routeRequestId; isThinking=true; try{const origin=pathQueue.length?pathQueue[pathQueue.length-1].coords.at(-1):(activeLeg?activeLeg.coords.at(-1):currentPos); const bearing=pathQueue.length?pathQueue[pathQueue.length-1].exitBearing:currentBearing; const scans=(await Promise.all(CONFIG.scanAngles.map(a=>scanRoute(origin,bearing,a)))).filter(Boolean); const seen=new Set(); const valid=scans.filter(s=>{if(seen.has(s.signature))return false; seen.add(s.signature); return s.coords.length>1}); if(requestId!==routeRequestId)return; if(valid.length){valid.forEach(v=>analytics[v.category].possible++); const pool=valid.filter(v=>v.category!=='UTurn'&&!v.loopRisk); const fallback=valid.filter(v=>v.category!=='UTurn'); const choices=pool.length?pool:(fallback.length?fallback:valid); choices.sort((a,b)=>(a.loopRisk-b.loopRisk)+(b.distance-a.distance)/10000); const top=choices.slice(0,Math.min(3,choices.length)); const chosen=top[Math.floor(Math.random()*top.length)]; analytics[chosen.category].taken++; analytics.Total++; updateAnalyticsUI(); pathQueue.push(chosen); log(`${chosen.category}: ${chosen.instruction}`,'future',chosen.coords[0]); drawPlannedPath();}else{log('No route options found. Try recentering near a road.','warn',origin)}}finally{isThinking=false; $('bufVal').innerText=`${pathQueue.length}/${CONFIG.maxBuffer}`; if(pathQueue.length<CONFIG.maxBuffer&&isDriving)setTimeout(fillRouteBuffer,250)}}
    function drawPlannedPath(){if(activePath)map.removeLayer(activePath); const all=pathQueue.flatMap(p=>p.coords); if(all.length)activePath=L.polyline(all,{color:'#0a84ff',weight:6,opacity:.32,dashArray:'10 10'}).addTo(map)}
    function setDriving(next){isDriving=next; const btn=$('driveBtn'); btn.textContent=next?'Pause Drive':'Engage Autonomy'; btn.classList.toggle('stop',next); if(next){lastFrameTime=null; fillRouteBuffer().then(()=>requestAnimationFrame(driveLoop)); log('Autonomy engaged.','active')}else{log('Drive paused.','warn')}}
    function driveLoop(ts){if(!isDriving)return; if(!lastFrameTime)lastFrameTime=ts; const dt=Math.min(.08,(ts-lastFrameTime)/1000); lastFrameTime=ts; if(!activeLeg){if(pathQueue.length){activeLeg=pathQueue.shift(); drawPlannedPath(); log(activeLeg.instruction,'active',activeLeg.coords[0]); $('bufVal').innerText=`${pathQueue.length}/${CONFIG.maxBuffer}`; fillRouteBuffer();}else{fillRouteBuffer(); requestAnimationFrame(driveLoop); return;}}
      let remaining=CONFIG.simMetersPerSecond*dt; while(activeLeg&&remaining>0){const next=activeLeg.coords[1]; if(!next){activeLeg=null;break;} const dist=map.distance(currentPos,next); if(dist<=remaining){totalMeters+=dist; currentPos=next; activeLeg.coords.shift(); remaining-=dist; if(activeLeg.coords.length<2)activeLeg=null;}else{const ratio=remaining/dist; const prev=currentPos; currentPos=[currentPos[0]+(next[0]-currentPos[0])*ratio,currentPos[1]+(next[1]-currentPos[1])*ratio]; totalMeters+=remaining; currentBearing=bearingBetween(prev,currentPos); remaining=0;}}
      if(carMarker){carMarker.setLatLng(currentPos); const car=$('car'); if(car)car.style.transform=`rotate(${currentBearing}deg)`} if(trail)trail.addLatLng(currentPos); visited.push(currentPos); if(visited.length>CONFIG.recentPointLimit)visited.shift(); if(autoFollow)map.panTo(currentPos,{animate:false}); updateHud(); requestAnimationFrame(driveLoop)}
    function updateHud(){$('odoVal').innerText=(totalMeters/1609.344).toFixed(2)+' mi'; const dirs=['N','NE','E','SE','S','SW','W','NW']; $('dirVal').innerText=dirs[Math.round(currentBearing/45)%8]; const end=activeLeg?.coords?.at(-1); $('distVal').innerText=end?Math.round(map.distance(currentPos,end)*3.28084)+' ft':'-- ft'; $('bufVal').innerText=`${pathQueue.length}/${CONFIG.maxBuffer}`; updateAnalyticsUI();}
    function toggleFollow(force){autoFollow=typeof force==='boolean'?force:!autoFollow; $('followBtn').classList.toggle('active',autoFollow); $('followBtn').textContent=autoFollow?'View Lock':'Free View'}
    function recenter(){if(currentPos){map.setView(currentPos,Math.max(map.getZoom(),17)); if(!autoFollow)toggleFollow(true)}}
    function zoomMap(delta){map.setZoom(map.getZoom()+delta); $('zoomLevel').innerText=Math.round(map.getZoom())}
    function toggleLog(){const p=$('logPanel'); p.classList.toggle('collapsed'); $('toggleIcon').textContent=p.classList.contains('collapsed')?'⬅️':'➡️'}
    function clearTrail(){if(trail){map.removeLayer(trail); trail=L.polyline([currentPos],{color:'#30d158',weight:4,opacity:.55}).addTo(map)} log('Trail cleared.','warn')}
    function resetTrip(){setDriving(false); pathQueue=[]; activeLeg=null; totalMeters=0; Object.keys(analytics).forEach(k=>{if(k==='Total')analytics[k]=0;else analytics[k]={taken:0,possible:0}}); routeRequestId++; if(activePath){map.removeLayer(activePath);activePath=null} clearTrail(); updateHud(); log('Trip reset.','warn')}
    $('driveBtn').onclick=()=>setDriving(!isDriving); $('resetBtn').onclick=resetTrip; map.on('zoomend',()=>$('zoomLevel').innerText=Math.round(map.getZoom())); initLocation();
  </script>
</body>
</html>
