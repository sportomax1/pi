<style>

</head>
<body>
<div class="app"><header class="topbar"><div class="brand"><h1>Ultimate Photo Collage</h1><p>Arrange up to 10 photos, drag to swap, then export a crisp image.</p></div><div class="actions"><button class="btn" id="settingsBtn">⚙ Settings</button><button class="btn" id="shuffleBtn" disabled>↻ Shuffle</button><button class="btn danger" id="clearBtn" disabled>Clear</button><button class="btn primary" id="downloadBtn" disabled>↓ Download</button></div></header><main class="workspace"><section class="panel left"><div class="panel-title">Photos</div><div class="panel-body"><span class="photo-count" id="photoCount">0 of 10 added</span><label class="upload-zone" id="uploadZone"><span class="upload-icon">＋</span><span class="upload-copy"><strong>Add photos</strong><span>Click or drop images here</span></span><input id="fileInput" type="file" accept="image/*" multiple></label><div class="thumbs" id="thumbs"></div><label class="btn add-more" id="addMoreBtn" hidden>＋ Add more photos<input type="file" accept="image/*" multiple hidden></label><div class="hint">Drag collage photos to swap them. Click one to adjust its crop in Settings.</div></div></section><section class="panel stage-panel"><div class="empty-state" id="emptyState"><span class="big">▦</span><strong>Add 1–10 photos</strong><br>Layouts are selected automatically.</div><div class="canvas-wrap" id="canvasWrap" hidden><div class="collage" id="collage"></div></div></section></main></div>

<script>

const opts={1:[['full','Full']],2:[['2cols','Left / Right'],['2rows','Top / Bottom']],3:[['3cols','3 Across'],['3rows','3 Stacked'],['triangle','Triangle'],['hero2','Hero + 2']],4:[['2x2','2 × 2'],['4cols','4 Across'],['4rows','4 Stacked'],['hero3','Hero + 3']],5:[['3-2','3 + 2'],['2-3','2 + 3'],['hero4','Hero + 4']],6:[['3x2','3 × 2'],['2x3','2 × 3'],['hero5','Hero + 5']],7:[['4-3','4 + 3'],['3-4','3 + 4'],['hero6','Hero + 6']],8:[['4x2','4 × 2'],['2x4','2 × 4']],9:[['3x3','3 × 3'],['hero8','Hero + 8']],10:[['5x2','5 × 2'],['2x5','2 × 5'],['hero9','Hero + 9']]};

function controls(){const p=state.photos[state.selected];[E.zoom,E.x,E.y].forEach(e=>e.disabled=!p);if(!p)return;E.zoom.value=p.zoom*100;E.x.value=p.x*100;E.y.value=p.y*100;$('#zoomValue').textContent=Math.round(p.zoom*100)+'%';$('#xValue').textContent=Math.round(p.x*100)+'%';$('#yValue').textContent=Math.round(p.y*100)+'%'}
function rects(w,h,s,n){const scale=w/E.collage.clientWidth,g=state.gap*scale,p=state.padding*scale,iw=w-p*2,ih=h-p*2;if(s.areas){const map=s.areas.map(r=>r.split(' ')),cw=(iw-g*(s.cols-1))/s.cols,ch=(ih-g*(s.rows-1))/s.rows;return [...Array(n)].map((_,i)=>{const k=String.fromCharCode(97+i),xs=[],ys=[];map.forEach((row,y)=>row.forEach((v,x)=>{if(v===k){xs.push(x);ys.push(y)}}));const x1=Math.min(...xs),x2=Math.max(...xs),y1=Math.min(...ys),y2=Math.max(...ys);return{x:p+x1*(cw+g),y:p+y1*(ch+g),w:(x2-x1+1)*cw+(x2-x1)*g,h:(y2-y1+1)*ch+(y2-y1)*g}})}const cw=(iw-g*(s.cols-1))/s.cols,ch=(ih-g*(s.rows-1))/s.rows;let col=0,row=0;return [...Array(n)].map((_,i)=>{const span=s.spans?s.spans[i]:1;if(col+span>s.cols){row++;col=0}const r={x:p+col*(cw+g),y:p+row*(ch+g),w:span*cw+(span-1)*g,h:ch};col+=span;if(!s.spans&&col>=s.cols){row++;col=0}return r})}
