<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Collage Studio</title><style>html,body{margin:0;min-height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}small{color:#9aa7bd}button{margin-top:16px;padding:10px 14px;border:0;border-radius:10px;font:inherit}</style></head><body><div id="loading"><div><strong>Opening Photo Collage Studio…</strong><br><small>The editor is loading.</small></div></div><script>(async()=>{const box=document.getElementById('loading');try{if(!('DecompressionStream'in window))throw new Error('Your browser needs a newer Safari or Chrome version.');const urls=['photo-collage-assets/payload-1.txt','photo-collage-assets/payload-2.txt','photo-collage-assets/payload-3.txt'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u+'?v=b13091c',{cache:'no-store'});if(!r.ok)throw new Error('Could not load app files.');return r.text()}));const s=parts.join('').replace(/\s/g,'');const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('<title>Ultimate Photo Collage</title>')||!html.includes('copyImage'))throw new Error('App validation failed.');document.open();document.write(html);document.close()}catch(e){console.error(e);box.innerHTML='<div><strong>Could not open the editor.</strong><br><small>'+String(e.message||e)+'</small><br><button onclick="location.reload()">Try again</button></div>'}})();</script></body></html>
