<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keegan's Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background:#020617; color:#f8fafc; min-height:100svh; }
    .glass-tile { background:rgba(15,23,42,.62); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.07); box-shadow:0 12px 30px rgba(0,0,0,.25); overflow:hidden; display:flex; flex-direction:column; position:relative; min-height:0; }
    .glass-tile:hover { border-color:rgba(148,163,184,.45); background:rgba(30,41,59,.72); }
    .no-scrollbar::-webkit-scrollbar { display:none; } .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    .progress-bar { transition:width .1s linear; }
    .clock-text { font-size:clamp(2.6rem, 7vw, 4.5rem); }
    .tile-title { padding:.5rem .75rem; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.16em; color:#94a3b8; text-align:center; background:rgba(15,23,42,.38); border-bottom:1px solid rgba(148,163,184,.18); }
    .mobile-rail { display:none; }

    @media (min-width: 768px) {
      body.dashboard-body { height:100vh; width:100vw; overflow:hidden; padding:1rem; gap:1rem; }
      #mainGrid { height:100%; flex:1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(0,1fr)); gap:1rem; }
    }
    @media (min-width: 1024px) {
      #mainGrid { grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 767px) {
      body.dashboard-body { min-height:100svh; overflow-y:auto; padding:calc(.75rem + var(--safe-top)) .75rem calc(1.25rem + var(--safe-bottom)); gap:.75rem; }
      #mainGrid { display:flex; flex-direction:column; gap:.85rem; height:auto; flex:none; }
      .glass-tile { min-height:300px; max-height:none; border-radius:1.35rem !important; }
      #tileClock { min-height:330px; }
      #tilePhotos { min-height:340px; }
      .clock-text { font-size:clamp(3.1rem, 17vw, 4.75rem); }
      .mobile-rail { display:flex; position:sticky; top:calc(.35rem + var(--safe-top)); z-index:40; gap:.45rem; overflow-x:auto; padding:.4rem; margin:-.1rem 0 .15rem; border:1px solid rgba(255,255,255,.07); border-radius:999px; background:rgba(2,6,23,.82); backdrop-filter:blur(16px); }
      .mobile-rail a { white-space:nowrap; flex:0 0 auto; padding:.48rem .72rem; border-radius:999px; background:rgba(15,23,42,.85); border:1px solid rgba(148,163,184,.15); color:#cbd5e1; font-size:11px; font-weight:900; text-decoration:none; }
      .mobile-rail a:active { transform:scale(.97); }
      .dashboard-header { display:flex !important; }
      .desktop-only { display:none !important; }
      .mobile-stack-grid { grid-template-columns:1fr !important; }
    }
  </style>
</head>
<body class="dashboard-body flex flex-col">
  <div class="fixed top-0 left-0 w-full h-1 bg-slate-950 z-50"><div id="globalTimerFill" class="h-full bg-blue-500 w-0 progress-bar"></div></div>

  <header class="dashboard-header hidden items-center justify-between gap-3 pt-1">
    <div>
      <div class="text-[10px] font-black uppercase tracking-[.24em] text-blue-300">Panels</div>
      <h1 class="text-xl font-black tracking-tight">Keegan Dashboard</h1>
    </div>
    <button id="pauseAllBtn" class="rounded-full border border-white/10 bg-slate-900/80 px-3 py-2 text-[11px] font-black text-slate-200">Pause</button>
  </header>

  <nav class="mobile-rail no-scrollbar" aria-label="Dashboard panels">
    <a href="#tileClock">Clock</a><a href="#tileHistoryWeather">History</a><a href="#tileWeather">Weather</a><a href="#tileSportsScores">Scores</a><a href="#tilePhotos">Photos</a><a href="#tileStack">Stack</a><a href="#tileFun">Ranks</a><a href="#tileSports">Schedule</a>
  </nav>

  <main id="mainGrid">
    <section id="tileClock" class="glass-tile rounded-3xl cursor-pointer">
      <div class="absolute inset-0 bg-gradient-to-br from-blue-500/10 to-purple-500/10 pointer-events-none"></div>
      <div class="p-4 pb-3 text-center relative z-10">
        <div id="clock" class="clock-text font-black text-white tracking-tighter leading-none">--:--</div>
        <div id="militaryTime" class="text-lg md:text-xl font-bold text-slate-400 mt-2">--:--</div>
      </div>
      <div id="clockView" class="flex-grow px-4 pb-4 flex flex-col items-center justify-center text-center relative z-10">
        <div class="w-full grid grid-cols-2 gap-3">
          <div class="bg-slate-900/50 rounded-2xl p-3 border border-white/5"><div id="sunTimes" class="text-lg font-black text-orange-300 leading-tight">--</div></div>
          <div class="bg-slate-900/50 rounded-2xl p-3 border border-white/5"><div id="moonPhase" class="text-lg font-black text-purple-300">--</div><div id="moonDates" class="text-[10px] text-slate-500 leading-tight mt-1">--</div></div>
        </div>
        <div id="currentWeather" class="mt-3 text-xl font-black text-blue-200">Loading...</div>
      </div>
      <div id="clockCalendarView" class="hidden flex-grow px-4 pb-4 flex flex-col gap-2 relative z-10">
        <div id="holidayCountdown" class="text-center text-[10px] font-bold text-slate-300 uppercase tracking-widest leading-relaxed"></div>
        <div id="calendar" class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-300 mt-1 flex-grow content-center"></div>
        <div class="mt-auto pt-2 border-t border-slate-700/50"><div id="upcomingHolidays" class="text-[9px] font-semibold text-slate-300 space-y-1"></div></div>
      </div>
      <div class="h-1 w-full bg-slate-800/80 mt-auto"><div id="clockSlider" class="h-full bg-blue-500 w-0 progress-bar"></div></div>
    </section>

    <section id="tileHistoryWeather" class="glass-tile rounded-3xl cursor-pointer"><div class="tile-title">Parker CO · Last 365 Days</div><div id="weatherHistory" class="flex-grow flex flex-col w-full h-full p-3 overflow-y-auto no-scrollbar"><div class="text-[9px] text-slate-400 text-center">Loading historical data...</div></div><div class="h-1 w-full bg-slate-800 mt-auto"><div id="historySlider" class="h-full bg-cyan-500 w-0 progress-bar"></div></div></section>
    <section id="tileWeather" class="glass-tile rounded-3xl cursor-pointer"><div id="weather" class="flex-grow flex flex-col justify-center items-center w-full h-full p-0 text-center overflow-hidden">Loading weather...</div><div class="h-1.5 w-full bg-slate-800 mt-auto"><div id="weatherSlider" class="h-full bg-blue-500 w-0 progress-bar"></div></div></section>
    <section id="tileSportsScores" class="glass-tile rounded-3xl cursor-pointer"><div id="scoresContent" class="flex-grow flex flex-col w-full h-full p-4 overflow-hidden"><div class="tile-title -mx-4 -mt-4 mb-4">Today's Scores</div><div id="scoresGrid" class="flex-grow flex flex-col gap-2 overflow-y-auto no-scrollbar"></div></div><div class="h-1.5 w-full bg-slate-800 mt-auto"><div id="scoresSlider" class="h-full bg-amber-500 w-0 progress-bar"></div></div></section>
    <section id="tilePhotos" class="glass-tile rounded-3xl relative cursor-pointer"><img id="photosImage" class="absolute inset-0 h-full w-full object-cover transition-opacity duration-700" alt="Slideshow photo"><div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/10 to-transparent pointer-events-none"></div><div class="absolute top-3 right-3 rounded-full bg-slate-950/70 px-2 py-1 text-[9px] font-bold text-slate-200 backdrop-blur-sm" id="photosCounter"></div><div class="absolute bottom-3 left-3 text-[9px] font-black uppercase tracking-[0.2em] text-white/80">Photos</div><div class="absolute bottom-0 left-0 h-1 w-full bg-slate-800/80"><div id="photosSlider" class="h-full bg-emerald-500 w-0 progress-bar"></div></div></section>
    <section id="tileStack" class="glass-tile rounded-3xl cursor-pointer"><div id="stackContent" class="flex-grow flex flex-col justify-center items-center w-full h-full p-4 overflow-hidden">Loading stack...</div><div class="h-1.5 w-full bg-slate-800 mt-auto"><div id="stackSlider" class="h-full bg-fuchsia-500 w-0 progress-bar"></div></div></section>
    <section id="tileFun" class="glass-tile rounded-3xl cursor-pointer"><div id="funTitle" class="tile-title">Rankings</div><div id="funGrid" class="grid grid-cols-5 gap-1 p-2 overflow-y-auto no-scrollbar flex-grow content-start">Loading...</div><div class="h-1 w-full bg-slate-800 mt-auto"><div id="funSlider" class="h-full bg-purple-500 w-0 progress-bar"></div></div></section>
    <section id="tileSports" class="glass-tile rounded-3xl cursor-pointer"><div id="sportsContent" class="flex-grow flex flex-col w-full h-full p-0 overflow-hidden relative"><div class="absolute inset-0 flex items-center justify-center text-xs text-slate-500">Loading teams...</div></div><div class="h-1.5 w-full bg-slate-800 mt-auto"><div id="sportsSlider" class="h-full bg-red-500 w-0 progress-bar"></div></div></section>
  </main>

<script>
const CONFIG={rotateIntervalMs:10000};
const pauseStates={weather:false,scores:false,sports:false,stack:false,history:false,fun:false,photos:false,clock:false};
let allPaused=false;
function isPaused(key){return allPaused||pauseStates[key];}
function setupPauseHandlers(){[['tileClock','clock'],['tileWeather','weather'],['tileSportsScores','scores'],['tileSports','sports'],['tileStack','stack'],['tileHistoryWeather','history'],['tileFun','fun'],['tilePhotos','photos']].forEach(([tileId,key])=>{const el=document.getElementById(tileId); if(el) el.addEventListener('click',()=>{pauseStates[key]=!pauseStates[key]; el.classList.toggle('border-white/40',pauseStates[key]); el.classList.toggle('bg-slate-800',pauseStates[key]);});});}
function startTileSlider(id, interval){const el=document.getElementById(id); if(!el)return; el.style.transition='none'; el.style.width='0%'; void el.offsetWidth; el.style.transition=`width ${interval}ms linear`; el.style.width='100%';}
function startGlobalTimer(){startTileSlider('globalTimerFill',CONFIG.rotateIntervalMs); setInterval(()=>startTileSlider('globalTimerFill',CONFIG.rotateIntervalMs),CONFIG.rotateIntervalMs);} 
document.getElementById('pauseAllBtn')?.addEventListener('click',e=>{allPaused=!allPaused; e.currentTarget.textContent=allPaused?'Resume':'Pause'; document.body.classList.toggle('ring-2',allPaused); document.body.classList.toggle('ring-blue-400/40',allPaused);});
setupPauseHandlers(); startGlobalTimer();

let sunriseTime='--:--', sunsetTime='--:--';
function calculateMoonPhase(date){let y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate(); if(m<3){y--;m+=12;} ++m; let jd=(365.25*y+30.6*m+d-694039.09)/29.5305882; let b=parseInt(jd); jd-=b; b=Math.round(jd*8); const phases=[['New Moon','🌑'],['Waxing Crescent','🌒'],['First Quarter','🌓'],['Waxing Gibbous','🌔'],['Full Moon','🌕'],['Waning Gibbous','🌖'],['Last Quarter','🌗'],['Waning Crescent','🌘']]; return {name:phases[b%8][0],emoji:phases[b%8][1],illum:(jd*100).toFixed(1),idx:b%8};}
function findFullMoonDates(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()); let last='--',next='--'; for(let i=0;i<=30;i++){const d=new Date(today); d.setDate(d.getDate()-i); if(calculateMoonPhase(d).idx===4){last=d.toLocaleDateString([],{month:'short',day:'numeric'});break;}} for(let i=1;i<=30;i++){const d=new Date(today); d.setDate(d.getDate()+i); if(calculateMoonPhase(d).idx===4){next=d.toLocaleDateString([],{month:'short',day:'numeric'});break;}} return {last,next};}
function updateClock(){const now=new Date(); document.getElementById('clock').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); document.getElementById('militaryTime').textContent=now.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+' • '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}); document.getElementById('sunTimes').innerHTML=`🌅 ${sunriseTime}<br>🌇 ${sunsetTime}`; const moon=calculateMoonPhase(now),dates=findFullMoonDates(); document.getElementById('moonPhase').innerHTML=`${moon.emoji} ${moon.name}<br><span class="text-xs text-purple-400 font-normal">${moon.illum}% Illum</span>`; document.getElementById('moonDates').innerHTML=`Last: ${dates.last}<br>Next: ${dates.next}`;}
setInterval(updateClock,1000); updateClock();
let clockViewIndex=0; const CLOCK_VIEWS=['clock','calendar'];
function setClockView(view){document.getElementById('clockView').classList.toggle('hidden',view==='calendar'); document.getElementById('clockCalendarView').classList.toggle('hidden',view!=='calendar'); if(view==='calendar') renderCalendar();}
function rotateClockView(){if(isPaused('clock'))return; clockViewIndex=(clockViewIndex+1)%CLOCK_VIEWS.length; setClockView(CLOCK_VIEWS[clockViewIndex]); startTileSlider('clockSlider',CONFIG.rotateIntervalMs);} setInterval(rotateClockView,CONFIG.rotateIntervalMs); startTileSlider('clockSlider',CONFIG.rotateIntervalMs);
function renderCalendar(){const now=new Date(),year=now.getFullYear(),month=now.getMonth(),today=now.getDate(); const start=new Date(year,0,1),dayOfYear=Math.floor((now-start)/86400000)+1,daysLeft=Math.ceil((new Date(year,11,31)-now)/86400000); document.getElementById('holidayCountdown').innerHTML=`Year ${year} • Day ${dayOfYear} • ${daysLeft} Left`; const firstDay=new Date(year,month,1).getDay(),daysInMonth=new Date(year,month+1,0).getDate(); let html=''; ['S','M','T','W','T','F','S'].forEach(d=>html+=`<div class="text-slate-500 text-[10px]">${d}</div>`); for(let i=0;i<firstDay;i++) html+='<div></div>'; for(let d=1;d<=daysInMonth;d++){const cls=d===today?'bg-blue-600 text-white rounded-full shadow shadow-blue-500/50':'text-slate-400'; html+=`<div class="${cls} flex items-center justify-center h-6 w-6 mx-auto text-[11px]">${d}</div>`;} document.getElementById('calendar').innerHTML=html; const holidays=[['New Year',new Date(year+1,0,1)],['Valentine',new Date(year,1,14)],['July 4th',new Date(year,6,4)],['Halloween',new Date(year,9,31)],['Thanksgiving',new Date(year,10,26)],['Christmas',new Date(year,11,25)]].filter(h=>h[1]>now).sort((a,b)=>a[1]-b[1]).slice(0,3); document.getElementById('upcomingHolidays').innerHTML=holidays.map(h=>`<div class="flex justify-between"><span>${h[0]}</span><span class="text-white">${Math.ceil((h[1]-now)/86400000)}d</span></div>`).join('');} renderCalendar();

let weatherData=null, forecastData=null, weatherIndex=0, weatherViews=['12hour','forecast','radar'];
function getWeatherIcon(c){if(c===0)return'☀️'; if(c<=3)return'⛅'; if(c>=61&&c<=63)return'🌧️'; if(c>=71)return'❄️'; return'☁️';}
async function loadWeather(){try{const lat=39.5186,lon=-104.7614; const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weathercode,precipitation_probability,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,rain_sum,snowfall_sum,windspeed_10m_max,precipitation_probability_max,sunrise,sunset,weathercode,uv_index_max&current_weather=true&timezone=auto&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch`); const d=await res.json(); weatherData=d; forecastData=d.daily; sunriseTime=new Date(d.daily.sunrise[0]).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); sunsetTime=new Date(d.daily.sunset[0]).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); document.getElementById('currentWeather').innerHTML=`🌡️ ${Math.round(d.daily.temperature_2m_max[0])}/${Math.round(d.daily.temperature_2m_min[0])}° • UV ${Math.round(d.daily.uv_index_max[0])}`; updateClock(); renderWeatherTile();}catch(e){document.getElementById('weather').innerHTML='<div class="text-xs text-slate-400">Weather unavailable</div>';}}
function renderWeatherTile(){if(!weatherData)return; const el=document.getElementById('weather'),view=weatherViews[weatherIndex]; if(view==='12hour'){el.innerHTML=`<div class="tile-title w-full">12-Hour Forecast</div><div class="flex-grow flex flex-col gap-1.5 w-full overflow-y-auto no-scrollbar px-4 py-4">${weatherData.hourly.time.slice(0,12).map((time,i)=>`<div class="flex justify-between items-center bg-white/5 p-2 rounded text-[11px] font-bold"><span class="w-9 text-slate-400 text-left">${new Date(time).getHours()%12||12}${new Date(time).getHours()<12?'a':'p'}</span><span>${getWeatherIcon(weatherData.hourly.weathercode[i])}</span><span>${Math.round(weatherData.hourly.temperature_2m[i])}°</span><span class="text-blue-300">${weatherData.hourly.precipitation_probability[i]}%</span><span class="text-emerald-300">${Math.round(weatherData.hourly.windspeed_10m[i])}mph</span></div>`).join('')}</div>`;} else if(view==='forecast'){el.innerHTML=`<div class="tile-title w-full">7-Day Outlook</div><div class="flex-grow flex flex-col gap-1.5 w-full px-4 py-4 overflow-y-auto no-scrollbar">${forecastData.time.slice(0,7).map((time,i)=>{const d=new Date(time); return `<div class="flex justify-between items-center bg-white/5 p-2 rounded text-[11px] font-bold"><span class="w-12 text-slate-400 text-left">${i===0?'Today':d.toLocaleDateString([],{weekday:'short'})}</span><span>${getWeatherIcon(forecastData.weathercode[i])}</span><span>${Math.round(forecastData.temperature_2m_max[i])}° <span class="text-slate-600">/ ${Math.round(forecastData.temperature_2m_min[i])}°</span></span><span class="text-blue-300">${forecastData.precipitation_probability_max[i]}%</span></div>`}).join('')}</div>`;} else {el.innerHTML=location.protocol==='file:'?'<div class="p-6 text-xs text-slate-400">Radar requires http(s).</div>':'<iframe title="Radar" src="https://embed.windy.com/embed2.html?lat=39.519&lon=-104.761&detailLat=39.519&detailLon=-104.761&width=650&height=450&zoom=7&level=surface&overlay=radar&product=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1" class="w-full h-full" frameborder="0" loading="lazy"></iframe>';}}
function rotateWeatherTile(){if(isPaused('weather'))return; weatherIndex=(weatherIndex+1)%weatherViews.length; renderWeatherTile(); startTileSlider('weatherSlider',CONFIG.rotateIntervalMs);} loadWeather(); setInterval(loadWeather,1800000); setInterval(rotateWeatherTile,CONFIG.rotateIntervalMs);

let historicalWeatherData=null, historyViewIndex=0; const historyViews=['temps','precip'];
async function loadHistoricalWeather(){try{const lat=39.5186,lon=-104.7614,today=new Date(),past=new Date(); past.setFullYear(today.getFullYear()-1); const res=await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${past.toISOString().split('T')[0]}&end_date=${today.toISOString().split('T')[0]}&daily=temperature_2m_max,temperature_2m_min,rain_sum,snowfall_sum&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=auto`); const data=await res.json(); historicalWeatherData=data.daily; renderHistoricalWeather();}catch(e){document.getElementById('weatherHistory').innerHTML='<div class="text-xs text-slate-400 text-center">History unavailable</div>';}}
function renderHistoricalWeather(){if(!historicalWeatherData)return; const el=document.getElementById('weatherHistory'); const highs=historicalWeatherData.temperature_2m_max||[],rains=historicalWeatherData.rain_sum||[],snows=historicalWeatherData.snowfall_sum||[]; if(historyViews[historyViewIndex]==='temps'){const ranges=[['<20',-999,20,'cyan'],['20-40',20,40,'sky'],['40-60',40,60,'lime'],['60-80',60,80,'orange'],['80-100',80,100,'rose'],['100+',100,999,'purple']]; const avg=(highs.reduce((a,b)=>a+b,0)/Math.max(1,highs.length)).toFixed(1); el.innerHTML=`<div class="grid grid-cols-2 gap-2 text-[10px]"><div class="col-span-2 text-center border-b border-slate-700 pb-2"><div class="text-sm font-black">365 Days</div><div class="text-slate-400">Avg High: ${avg}°</div></div>${ranges.map(r=>{const count=highs.filter(h=>h>=r[1]&&h<r[2]).length,pct=Math.round(count/Math.max(1,highs.length)*100); return `<div class="bg-slate-800/40 p-2 rounded border border-white/5"><div class="flex justify-between font-black"><span>${r[0]}°</span><span>${count}d</span></div><div class="h-1.5 bg-slate-700 rounded mt-2"><div class="h-full rounded bg-${r[3]}-500" style="width:${pct}%"></div></div><div class="text-[8px] text-slate-500 mt-1">${pct}%</div></div>`;}).join('')}</div>`;} else {const rain=rains.filter(x=>x>0).length,snow=snows.filter(x=>x>0).length,clear=Math.max(0,rains.length-rain-snow); el.innerHTML=`<div class="space-y-3 text-sm"><div class="text-center font-black border-b border-slate-700 pb-2">Precipitation</div>${[['🌧️','Rain Days',rain,'blue'],['❄️','Snow Days',snow,'cyan'],['☀️','Clear Days',clear,'yellow']].map(x=>`<div class="flex items-center justify-between bg-slate-800/40 p-3 rounded-xl border border-white/5"><span class="text-2xl">${x[0]}</span><span class="font-bold text-slate-300">${x[1]}</span><span class="text-${x[3]}-300 font-black">${x[2]}</span></div>`).join('')}</div>`;}}
function rotateHistoryView(){if(isPaused('history'))return; historyViewIndex=(historyViewIndex+1)%historyViews.length; renderHistoricalWeather(); startTileSlider('historySlider',CONFIG.rotateIntervalMs);} loadHistoricalWeather(); setInterval(rotateHistoryView,CONFIG.rotateIntervalMs);

const PHOTO_FILES=['../img/GPTempDownload.jpg','../img/IMG_0035.JPEG','../img/IMG_1099.JPG','../img/IMG_1262.JPG','../img/IMG_1414.JPEG','../img/IMG_2353.JPEG','../img/IMG_2436.JPEG','../img/IMG_2556.JPEG','../img/IMG_2975.JPEG','../img/IMG_3359.JPEG','../img/IMG_3456.JPEG','../img/IMG_5844.JPG','../img/IMG_5853.JPG','../img/IMG_6093.JPEG','../img/IMG_6532.JPEG','../img/IMG_8021_Original.JPEG','../img/IMG_8481.JPEG','../img/IMG_8534.JPG','../img/IMG_8629.JPEG','../img/IMG_8757.JPG','../img/IMG_9689.JPG','../img/Photo_6553732_DJI_132_jpg_4372504_0_2021531125138_photo_original.jpg'];
let photoOrder=[],photoIndex=0; function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;} function resetPhotos(){photoOrder=shuffle(PHOTO_FILES.slice()); photoIndex=0;} function showPhoto(){if(!photoOrder.length)resetPhotos(); const img=document.getElementById('photosImage'),counter=document.getElementById('photosCounter'); img.src=photoOrder[photoIndex]; counter.textContent=`${photoIndex+1}/${photoOrder.length}`;} function rotatePhotos(){if(isPaused('photos'))return; photoIndex=(photoIndex+1)%photoOrder.length; showPhoto(); startTileSlider('photosSlider',CONFIG.rotateIntervalMs);} resetPhotos(); photoIndex=Math.floor(Math.random()*photoOrder.length); showPhoto(); setInterval(rotatePhotos,CONFIG.rotateIntervalMs);

const FACTS=['Honey never spoils.','Octopuses have three hearts.','A group of flamingos is called a flamboyance.','Bananas are berries, but strawberries are not.','Otters hold hands while sleeping.','Lightning contains about 1 billion volts.'];
const STOCK_SYMBOLS=[['AAPL','aapl.us'],['AMZN','amzn.us'],['MSFT','msft.us'],['NVDA','nvda.us'],['TSLA','tsla.us'],['GOOGL','googl.us']]; let stockQuotes={},stackIndex=0,stackViews=['facts','stocks'];
async function loadStocks(){try{await Promise.all(STOCK_SYMBOLS.map(async s=>{const r=await fetch(`https://stooq.com/q/l/?s=${s[1]}&f=sd2t2ohlcv&h&e=csv`); const lines=(await r.text()).trim().split('\n'); if(lines[1]){const p=lines[1].split(','); stockQuotes[s[0]]={price:parseFloat(p[6]),open:parseFloat(p[3])};}})); renderStackView();}catch(e){}}
function renderStackView(){const el=document.getElementById('stackContent'),view=stackViews[stackIndex]; if(view==='stocks'){el.innerHTML=`<div class="w-full h-full flex flex-col"><div class="tile-title -mx-4 -mt-4 mb-3">Stocks</div><div class="grid grid-cols-2 gap-2 text-[11px] mobile-stack-grid">${STOCK_SYMBOLS.map(s=>{const q=stockQuotes[s[0]],pct=q?((q.price-q.open)/q.open*100):null; return `<div class="flex items-center justify-between bg-slate-800/40 border border-white/5 rounded-lg px-3 py-2"><span class="font-black">${s[0]}</span><span>${q?q.price.toFixed(2):'--'}</span><span class="font-black ${pct>=0?'text-emerald-300':'text-red-300'}">${pct==null?'--':(pct>=0?'+':'')+pct.toFixed(2)+'%'}</span></div>`;}).join('')}</div></div>`;} else {const fact=FACTS[new Date().getDate()%FACTS.length]; el.innerHTML=`<div class="w-full h-full flex flex-col justify-center items-center p-4 text-center"><div class="tile-title absolute top-0 left-0 right-0">Fact</div><div class="text-lg font-black text-blue-200">${fact}</div></div>`;}}
function rotateStack(){if(isPaused('stack'))return; stackIndex=(stackIndex+1)%stackViews.length; renderStackView(); startTileSlider('stackSlider',CONFIG.rotateIntervalMs);} loadStocks(); renderStackView(); setInterval(rotateStack,CONFIG.rotateIntervalMs); setInterval(loadStocks,600000);

const LEAGUES={nba:{name:'NBA',url:'https://site.web.api.espn.com/apis/v2/sports/basketball/nba/standings'},nfl:{name:'NFL',url:'https://site.web.api.espn.com/apis/v2/sports/football/nfl/standings'},nhl:{name:'NHL',url:'https://site.web.api.espn.com/apis/v2/sports/hockey/nhl/standings'},mlb:{name:'MLB',url:'https://site.web.api.espn.com/apis/v2/sports/baseball/mlb/standings'}}; let funKeys=Object.keys(LEAGUES),funIdx=0;
async function fetchRankings(){const key=funKeys[funIdx]; try{const res=await fetch(LEAGUES[key].url),data=await res.json(); let teams=[]; const walk=n=>{if(n.standings?.entries)teams.push(...n.standings.entries); if(n.children)n.children.forEach(walk);}; walk(data); teams=teams.map(e=>({name:e.team.abbreviation,logo:e.team.logos?.[0]?.href,rankVal:e.stats?.find(s=>s.name===(key==='nhl'?'points':'winPercent'))?.value||0})).sort((a,b)=>b.rankVal-a.rankVal).slice(0,25); renderRankings(teams,LEAGUES[key].name);}catch(e){document.getElementById('funGrid').innerHTML='<div class="col-span-5 text-xs text-slate-500">Rankings unavailable</div>';}}
function renderRankings(teams,league){document.getElementById('funTitle').textContent=`${league} Top ${teams.length}`; document.getElementById('funGrid').innerHTML=teams.map((t,i)=>`<div class="aspect-square bg-slate-800 rounded-lg relative overflow-hidden border border-slate-700 flex items-center justify-center p-1"><div class="w-full h-full rounded-md bg-slate-50/95 flex items-center justify-center"><img src="${t.logo}" class="w-10 h-10 object-contain" onerror="this.outerHTML='<div class=\'text-[8px] font-black text-slate-900\'>${t.name}</div>'"></div><div class="absolute top-0 left-0 bg-white text-black text-[7px] font-black px-1 rounded-br">#${i+1}</div></div>`).join('');}
function rotateFun(){if(isPaused('fun'))return; funIdx=(funIdx+1)%funKeys.length; fetchRankings(); startTileSlider('funSlider',CONFIG.rotateIntervalMs);} fetchRankings(); setInterval(rotateFun,CONFIG.rotateIntervalMs);

const SCORE_LEAGUES=[['NFL','football','nfl','🏈'],['NBA','basketball','nba','🏀'],['NHL','hockey','nhl','🏒'],['MLB','baseball','mlb','⚾']]; let scoresLeagueIdx=0,scoresData={};
async function loadSportsScoresByLeague(){for(const l of SCORE_LEAGUES){try{const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/${l[1]}/${l[2]}/scoreboard`),data=await res.json(),today=new Date().toISOString().split('T')[0]; scoresData[l[2]]={name:l[0],icon:l[3],games:(data.events||[]).filter(e=>new Date(e.date).toISOString().split('T')[0]===today||e.competitions[0].status.type.state==='in').map(e=>{const c=e.competitions[0],home=c.competitors.find(x=>x.homeAway==='home'),away=c.competitors.find(x=>x.homeAway==='away'); return {home:home?.team?.abbreviation,away:away?.team?.abbreviation,hs:home?.score||0,as:away?.score||0,status:c.status.type.description};})};}catch(e){}} renderSportsScoresCurrentLeague();}
function renderSportsScoresCurrentLeague(){const grid=document.getElementById('scoresGrid'); const l=SCORE_LEAGUES[scoresLeagueIdx],d=scoresData[l[2]]; if(!d||!d.games.length){grid.innerHTML='<div class="flex items-center justify-center h-full text-slate-400 text-xs">No active games</div>'; return;} grid.innerHTML=`<div class="text-[10px] font-black uppercase text-slate-300 text-center mb-2 pb-2 border-b border-slate-700">${d.icon} ${d.name} (${d.games.length})</div>`+d.games.map(g=>`<div class="flex items-center justify-between bg-slate-800/40 p-3 rounded-xl border border-slate-700/50 text-sm font-black"><span>${g.away} ${Math.round(g.as)}</span><span class="text-slate-500">${g.status}</span><span>${g.home} ${Math.round(g.hs)}</span></div>`).join('');}
function rotateSportsLeague(){if(isPaused('scores'))return; scoresLeagueIdx=(scoresLeagueIdx+1)%SCORE_LEAGUES.length; renderSportsScoresCurrentLeague(); startTileSlider('scoresSlider',CONFIG.rotateIntervalMs);} loadSportsScoresByLeague(); setInterval(loadSportsScoresByLeague,300000); setInterval(rotateSportsLeague,CONFIG.rotateIntervalMs);

const MY_TEAMS=[['nuggets','basketball','nba','den','🏀'],['broncos','football','nfl','den','🏈'],['avalanche','hockey','nhl','col','🏒'],['rockies','baseball','mlb','col','⚾']]; let sportsIdx=0;
function getDayBadge(date){const t=new Date(); t.setHours(0,0,0,0); const d=new Date(date); d.setHours(0,0,0,0); const diff=Math.round((d-t)/86400000); if(diff===0)return'Today'; if(diff===1)return'Tomorrow'; return date.toLocaleDateString([],{weekday:'short'});} 
async function loadSportsTeam(){const team=MY_TEAMS[sportsIdx]; const container=document.getElementById('sportsContent'); try{const res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/${team[1]}/${team[2]}/teams/${team[3]}/schedule`),data=await res.json(),now=new Date(); const games=(data.events||[]).filter(e=>new Date(e.date)>=now||e.competitions[0].status.type.state==='in').slice(0,5); if(!games.length){container.innerHTML='<div class="flex items-center justify-center h-full text-slate-500 text-xs">No games found</div>';return;} container.innerHTML=`<div class="flex items-center justify-between border-b border-slate-700/70 p-4"><div><div class="text-[10px] font-black uppercase tracking-[.2em] text-slate-400">${team[2].toUpperCase()} Schedule</div><div class="text-sm font-black">${team[4]} ${team[0].toUpperCase()}</div></div><div class="text-[9px] font-bold text-slate-500">${new Date().toLocaleDateString([],{month:'short',day:'numeric'})}</div></div><div class="space-y-2 overflow-y-auto no-scrollbar p-4">`+games.map(evt=>{const comp=evt.competitions[0],date=new Date(evt.date),my=comp.competitors.find(c=>c.team.abbreviation.toLowerCase()===team[3]),opp=comp.competitors.find(c=>c.team.abbreviation.toLowerCase()!==team[3]),mark=my?.homeAway==='away'?'@':'vs'; return `<div class="flex items-center justify-between gap-3 bg-slate-800/50 p-3 rounded-xl text-sm border border-white/5"><div><span class="inline-flex px-2 py-0.5 rounded-full text-[9px] font-black border bg-slate-500/10 text-slate-200 border-white/10">${getDayBadge(date)}</span><div class="text-[10px] font-bold text-slate-400 mt-1">${date.toLocaleDateString([],{month:'numeric',day:'numeric'})} ${date.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div></div><div class="text-right text-[11px] font-black text-white">${mark} ${opp.team.abbreviation}</div></div>`;}).join('')+'</div>'; }catch(e){container.innerHTML='<div class="flex items-center justify-center h-full text-slate-500 text-xs">Schedule unavailable</div>';}}
function rotateSports(){if(isPaused('sports'))return; sportsIdx=(sportsIdx+1)%MY_TEAMS.length; loadSportsTeam(); startTileSlider('sportsSlider',CONFIG.rotateIntervalMs);} loadSportsTeam(); setInterval(rotateSports,CONFIG.rotateIntervalMs);
</script>
