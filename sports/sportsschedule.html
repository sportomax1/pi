<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Sports Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--cell-w:84px;--row-h:68px;--head-h:64px}
    body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a;height:100vh;overflow:hidden;display:flex;flex-direction:column}
    header{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;z-index:60;flex-shrink:0}
    #content-area{flex:1;overflow:hidden;position:relative;background:#f1f5f9;display:flex;flex-direction:column}
    .table-view{overflow:auto;background:white;flex:1;border-top:1px solid #cbd5e1;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
    table{border-collapse:separate;border-spacing:0;min-width:100%}
    th,td{padding:0;text-align:center;vertical-align:middle;background:#fff;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;box-sizing:border-box;min-width:var(--cell-w)}
    thead th{position:sticky;top:0;z-index:30;background:#f8fafc;border-bottom:2px solid #cbd5e1;height:var(--head-h)}
    tbody td:first-child,thead th:first-child{position:sticky;left:0;z-index:40;background:#f8fafc;border-right:2px solid #cbd5e1;min-width:64px}
    thead th:first-child{z-index:50;background:#f1f5f9}
    tbody td{height:var(--row-h)}
    body.density-compact{--cell-w:70px;--row-h:54px;--head-h:54px}
    body.density-large{--cell-w:104px;--row-h:84px;--head-h:76px}
    .win-bg{background-color:#bbf7d0!important}.loss-bg{background-color:#fecaca!important}.today-highlight{background-color:#eff6ff!important}
    .today-date{box-shadow:inset 4px 0 0 #2563eb}
    .game-content{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:calc(var(--row-h) - 4px);font-size:11px;padding:3px 2px}
    .game-divider{width:80%;border-top:1px solid rgba(100,116,139,.25);margin:3px 0}
    .game-button{width:100%;border-radius:6px;padding:2px 1px;transition:background .12s;cursor:pointer}
    .game-button:hover{background:rgba(148,163,184,.12)}
    .status-live{color:#ea580c;font-weight:800;animation:pulse 1.5s infinite}.status-win{color:#166534;font-weight:900}.status-loss{color:#991b1b;font-weight:900}.status-special{color:#7c3aed;font-weight:800}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:100;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
    .league-chip,.filter-chip{border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;white-space:nowrap}
    .league-chip.active,.filter-chip.active{background:#0f172a;color:#fff;border-color:#0f172a}
    .team-head{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:calc(var(--head-h) - 2px);padding:3px;position:relative}
    .team-head img{width:30px;height:30px;object-fit:contain}.team-head-label{font-size:8px;font-weight:800;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#475569}
    .team-head-meta{font-size:7px;color:#94a3b8;font-weight:700}
    .remove-head{position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:999px;background:#fee2e2;color:#b91c1c;font-size:11px;line-height:16px;font-weight:900;opacity:0;transition:opacity .15s}
    th:hover .remove-head{opacity:1}
    .pin{font-size:10px;line-height:1;color:#cbd5e1}.pin.active{color:#f59e0b}
    .homeaway{font-size:7px;font-weight:900;border-radius:999px;padding:1px 4px;background:#f1f5f9;color:#64748b}
    .league-divider td{height:28px!important;background:#f8fafc!important;text-align:left;padding-left:10px;font-size:9px;font-weight:900;letter-spacing:.08em;color:#64748b;text-transform:uppercase}
    .dragging{opacity:.45}.drag-handle{cursor:grab;color:#94a3b8;font-size:16px;user-select:none}
    .toolbar{display:flex;gap:8px;align-items:center;padding:7px 10px;background:white;border-bottom:1px solid #e2e8f0;overflow-x:auto;flex-shrink:0}
    .toolbar::-webkit-scrollbar{display:none}
    .details-grid{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
    .details-grid dt{color:#64748b;font-weight:700}.details-grid dd{margin:0;font-weight:600;color:#0f172a}
  </style>
</head>
<body>
<header>
  <div class="h-14 md:h-16 flex items-center justify-between px-3 md:px-6 gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-black text-lg shadow-sm flex-shrink-0">S</div>
      <div class="min-w-0"><h1 class="text-sm md:text-lg font-bold tracking-tight text-slate-800 uppercase hidden sm:block">Master Schedule</h1><div id="team-count" class="text-[9px] text-slate-400 font-bold uppercase"></div></div>
    </div>
    <div class="flex gap-2 flex-shrink-0">
      <button onclick="refreshSchedules()" class="px-3 py-1.5 bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-lg shadow-sm">↻ <span class="hidden sm:inline">REFRESH</span></button>
      <button onclick="toggleFlip()" class="px-3 py-1.5 bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-lg shadow-sm">AXIS</button>
      <button onclick="openModal()" class="px-3 py-1.5 bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-lg shadow-sm">TEAMS</button>
      <button onclick="scrollToToday()" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold shadow-sm">TODAY</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="flex gap-1" id="window-filters"></div>
    <button id="upcoming-toggle" onclick="toggleUpcomingOnly()" class="filter-chip">UPCOMING ONLY</button>
    <button id="group-toggle" onclick="toggleLeagueGrouping()" class="filter-chip">GROUP LEAGUES</button>
    <button onclick="toggleHideEmpty()" class="filter-chip"><span id="hide-label">SHOW ALL DATES</span></button>
    <label class="text-[10px] font-black text-slate-400 ml-1">DENSITY</label>
    <select id="density-select" onchange="setDensity(this.value)" class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white font-bold text-slate-700">
      <option value="compact">Compact</option><option value="normal">Normal</option><option value="large">Large</option>
    </select>
    <span id="last-updated" class="text-[10px] text-slate-400 font-semibold ml-auto whitespace-nowrap"></span>
  </div>
</header>
<div id="content-area">
  <div id="status-bar" class="hidden px-3 py-2 text-xs font-semibold border-b"></div>
  <div id="loading" class="absolute inset-0 bg-white z-50 flex flex-col items-center justify-center">
    <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Loading schedules...</span>
  </div>
  <div id="table-container" class="table-view hidden"><table id="main-table"><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
</div>
<div id="manage-modal" class="hidden modal-overlay">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-xl max-h-[90vh] flex flex-col m-4 overflow-hidden">
    <div class="p-4 border-b flex justify-between items-center bg-slate-50"><div><h3 class="font-bold">Manage Teams</h3><div class="text-[10px] text-slate-500">Changes save instantly · drag to reorder · star to pin</div></div><button onclick="closeModal()" class="text-2xl">&times;</button></div>
    <div class="p-4 border-b bg-white space-y-3">
      <div><div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Quick add Colorado</div><div id="quick-add" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div></div>
      <div><div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">League</div><div id="league-chips" class="flex gap-2 overflow-x-auto pb-1"></div></div>
      <div class="flex gap-2"><input type="text" id="search-input" placeholder="Search team name or abbreviation..." class="flex-1 border rounded-lg px-3 py-2 text-sm" oninput="debouncedSearch()" onkeydown="if(event.key==='Enter')searchTeams()"><button onclick="searchTeams()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Search</button></div>
      <div id="search-status" class="text-[10px] text-slate-400 min-h-[14px]"></div>
      <div id="search-results" class="max-h-56 overflow-y-auto divide-y border rounded-lg"></div>
    </div>
    <div class="flex-1 overflow-y-auto p-4"><div class="flex items-center justify-between mb-2"><div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">My teams</div><button onclick="resetDefaultTeams()" class="text-[10px] font-bold text-slate-500 hover:text-slate-900">Reset Colorado</button></div><ul id="team-list" class="space-y-2"></ul></div>
    <div class="p-4 border-t flex justify-end"><button onclick="closeModal()" class="px-5 py-2 bg-slate-900 text-white font-bold rounded-lg">Done</button></div>
  </div>
</div>
<div id="game-modal" class="hidden modal-overlay" onclick="if(event.target===this)closeGameDetails()">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md m-4 overflow-hidden">
    <div class="p-4 border-b flex justify-between items-start bg-slate-50"><div><div id="game-title" class="font-black text-lg"></div><div id="game-subtitle" class="text-xs text-slate-500 mt-1"></div></div><button onclick="closeGameDetails()" class="text-2xl leading-none">&times;</button></div>
    <div id="game-details" class="p-4"></div>
  </div>
</div>
<script>
const LEAGUES=[{s:'baseball',l:'mlb',label:'MLB'},{s:'football',l:'nfl',label:'NFL'},{s:'basketball',l:'nba',label:'NBA'},{s:'hockey',l:'nhl',label:'NHL'},{s:'basketball',l:'wnba',label:'WNBA'},{s:'football',l:'college-football',label:'NCAA FB'},{s:'basketball',l:'mens-college-basketball',label:'NCAA MBB'},{s:'basketball',l:'womens-college-basketball',label:'NCAA WBB'},{s:'baseball',l:'college-baseball',label:'NCAA Baseball'}];
const QUICK_TEAMS=[{id:'27',sport:'baseball',league:'mlb',name:'Rockies',abbr:'COL',logo:'https://a.espncdn.com/i/teamlogos/mlb/500/col.png'},{id:'7',sport:'football',league:'nfl',name:'Broncos',abbr:'DEN',logo:'https://a.espncdn.com/i/teamlogos/nfl/500/den.png'},{id:'7',sport:'basketball',league:'nba',name:'Nuggets',abbr:'DEN',logo:'https://a.espncdn.com/i/teamlogos/nba/500/den.png'},{id:'17',sport:'hockey',league:'nhl',name:'Avalanche',abbr:'COL',logo:'https://a.espncdn.com/i/teamlogos/nhl/500/col.png'}];
const DEFAULT_TEAMS=[...QUICK_TEAMS],TEAM_CACHE=new Map(),WINDOWS=[{id:'past7',label:'PAST 7'},{id:'today',label:'TODAY'},{id:'next7',label:'NEXT 7'},{id:'next30',label:'NEXT 30'},{id:'full',label:'FULL'}];
let TEAMS=loadSavedTeams(),SCHEDULES={},IS_FLIPPED=false,SORTED_DATES=[],LOAD_ERRORS=[],ACTIVE_LEAGUE='mlb',SEARCH_TIMER=null,SEARCH_TOKEN=0,LAST_SEARCH_RESULTS=[];
let DATE_WINDOW=localStorage.getItem('sports_date_window')||'next30',UPCOMING_ONLY=JSON.parse(localStorage.getItem('sports_upcoming_only')||'false'),GROUP_LEAGUES=JSON.parse(localStorage.getItem('sports_group_leagues')||'false'),HIDE_EMPTY=JSON.parse(localStorage.getItem('hide_empty')??'true'),DENSITY=localStorage.getItem('sports_density')||'normal',LAST_UPDATED=null,DRAG_INDEX=null;
const teamKey=t=>`${t.league}:${t.id}`,dateKey=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`},startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function loadSavedTeams(){try{const raw=JSON.parse(localStorage.getItem('my_sports_teams'));if(Array.isArray(raw)&&raw.length)return raw.map(normalizeTeam).filter(Boolean)}catch{}return DEFAULT_TEAMS.map(t=>({...t,pinned:false}))}
function normalizeTeam(t){if(!t||t.id==null||!t.league)return null;const meta=LEAGUES.find(x=>x.l===t.league);return{id:String(t.id),sport:t.sport||meta?.s||'basketball',league:t.league,name:t.name||t.shortDisplayName||t.displayName||t.abbr||'Team',abbr:t.abbr||t.abbreviation||'',logo:t.logo||'',pinned:!!t.pinned}}
function saveTeams(){localStorage.setItem('my_sports_teams',JSON.stringify(TEAMS));updateTeamCount()}
function updateTeamCount(){document.getElementById('team-count').textContent=`${TEAMS.length} team${TEAMS.length===1?'':'s'}`}
function seasonCandidates(team){const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1;if(['nba','nhl','mens-college-basketball','womens-college-basketball'].includes(team.league)){const endYear=m>=7?y+1:y;return[endYear-1,endYear,endYear+1]}return[y-1,y,y+1]}
async function fetchJson(url,timeoutMs=12000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeoutMs);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json()}finally{clearTimeout(timer)}}
async function init(){document.getElementById('hide-label').textContent=HIDE_EMPTY?'SHOW ALL DATES':'HIDE EMPTY DATES';document.getElementById('density-select').value=DENSITY;setDensity(DENSITY,false);updateTeamCount();renderWindowFilters();syncToggleButtons();renderLeagueChips();renderQuickAdd();await loadAllSchedules();LAST_UPDATED=new Date();updateLastUpdated();document.getElementById('loading').classList.add('hidden');document.getElementById('table-container').classList.remove('hidden');render();showStatus();setTimeout(scrollToToday,250)}
async function loadAllSchedules(){LOAD_ERRORS=[];const results=await Promise.allSettled(TEAMS.map(fetchSchedule));results.forEach((r,i)=>{const t=TEAMS[i];if(r.status==='fulfilled')SCHEDULES[teamKey(t)]=r.value;else{SCHEDULES[teamKey(t)]={};LOAD_ERRORS.push(`${t.name}: ${r.reason?.message||'schedule failed'}`)}})}
async function refreshSchedules(){setInlineStatus('Refreshing schedules…','info');await loadAllSchedules();LAST_UPDATED=new Date();updateLastUpdated();render();showStatus();if(!LOAD_ERRORS.length)setInlineStatus('Schedules refreshed.','success')}
async function fetchSchedule(team){const urls=seasonCandidates(team).map(season=>`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}/schedule?season=${season}`),settled=await Promise.allSettled(urls.map(u=>fetchJson(u))),successful=settled.filter(x=>x.status==='fulfilled').map(x=>x.value);if(!successful.length)throw new Error('No ESPN schedule data');const map={},seen=new Set();successful.flatMap(d=>d.events||[]).forEach(event=>{if(!event?.id||seen.has(event.id))return;seen.add(event.id);const comp=event.competitions?.[0],us=comp?.competitors?.find(c=>String(c.id)===String(team.id)),them=comp?.competitors?.find(c=>String(c.id)!==String(team.id));if(!comp||!us||!them)return;const when=new Date(event.date);if(Number.isNaN(when.getTime()))return;const key=dateKey(when),state=event.status?.type?.state||'pre',completed=event.status?.type?.completed===true||state==='post',statusName=event.status?.type?.shortDetail||event.status?.type?.detail||event.status?.type?.description||'',usScore=Number(us.score?.displayValue??us.score?.value??0),themScore=Number(them.score?.displayValue??them.score?.value??0);let result=null;if(completed)result=usScore>themScore?'W':usScore<themScore?'L':'T';const venue=comp.venue?.fullName||'',address=[comp.venue?.address?.city,comp.venue?.address?.state].filter(Boolean).join(', '),network=comp.broadcasts?.[0]?.names?.[0]||comp.broadcasts?.[0]?.media?.shortName||'',link=(event.links||[]).find(l=>/summary|gamecast/i.test(l?.rel?.join?.(' ')||l?.text||''))?.href||event.links?.[0]?.href||'';const game={id:event.id,teamKey:teamKey(team),teamName:team.name,teamAbbr:team.abbr||team.name,teamLogo:team.logo,league:team.league,sport:team.sport,time:when.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),date:when.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}),timestamp:when.getTime(),oppLogo:them.team?.logos?.[0]?.href||'',oppName:them.team?.shortDisplayName||them.team?.displayName||them.team?.abbreviation||'Opponent',oppAbbr:them.team?.abbreviation||them.team?.shortDisplayName||'OPP',isAway:us.homeAway==='away',state,completed,score:`${Number.isFinite(usScore)?usScore:0}-${Number.isFinite(themScore)?themScore:0}`,result,status:statusName,network,venue,address,attendance:comp.attendance||'',link,notes:comp.notes?.map(n=>n.headline).filter(Boolean).join(' · ')||''};(map[key]??=[]).push(game)});Object.values(map).forEach(g=>g.sort((a,b)=>a.timestamp-b.timestamp));return map}
function updateLastUpdated(){document.getElementById('last-updated').textContent=LAST_UPDATED?`Updated ${LAST_UPDATED.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`:''}
function showStatus(){const bar=document.getElementById('status-bar'),total=Object.values(SCHEDULES).reduce((sum,s)=>sum+Object.values(s).reduce((n,g)=>n+g.length,0),0);bar.classList.add('hidden');if(LOAD_ERRORS.length){bar.className='px-3 py-2 text-xs font-semibold border-b bg-amber-50 text-amber-800 border-amber-200';bar.textContent=`Loaded ${total} games. Some teams failed: ${LOAD_ERRORS.join(' • ')}`;bar.classList.remove('hidden')}else if(!total&&TEAMS.length){bar.className='px-3 py-2 text-xs font-semibold border-b bg-amber-50 text-amber-800 border-amber-200';bar.textContent='No games were returned. Try removing and re-adding the affected team.';bar.classList.remove('hidden')}}
function getVisibleTeams(){let teams=[...TEAMS];if(GROUP_LEAGUES){const order=LEAGUES.map(x=>x.l);teams.sort((a,b)=>order.indexOf(a.league)-order.indexOf(b.league)||Number(b.pinned)-Number(a.pinned)||TEAMS.indexOf(a)-TEAMS.indexOf(b))}else teams.sort((a,b)=>Number(b.pinned)-Number(a.pinned)||TEAMS.indexOf(a)-TEAMS.indexOf(b));return teams}
function getWindowBounds(){const today=startOfDay(new Date());if(DATE_WINDOW==='past7')return[new Date(today.getTime()-6*86400000),today];if(DATE_WINDOW==='today')return[today,today];if(DATE_WINDOW==='next7')return[today,new Date(today.getTime()+6*86400000)];if(DATE_WINDOW==='next30')return[today,new Date(today.getTime()+29*86400000)];return[null,null]}
function getVisibleDates(){const dates=new Set();Object.values(SCHEDULES).forEach(s=>Object.keys(s).forEach(d=>dates.add(d)));let arr=[...dates].sort();const[minBound,maxBound]=getWindowBounds();if(minBound)arr=arr.filter(x=>{const d=new Date(`${x}T12:00:00`);return d>=minBound&&d<=new Date(maxBound.getFullYear(),maxBound.getMonth(),maxBound.getDate(),23,59,59)});if(UPCOMING_ONLY){const now=Date.now();arr=arr.filter(date=>getVisibleTeams().some(t=>(SCHEDULES[teamKey(t)]?.[date]||[]).some(g=>!g.completed&&g.timestamp>=now-6*3600000)))}if(!HIDE_EMPTY&&minBound&&maxBound){const range=[];for(let d=new Date(minBound);d<=maxBound;d.setDate(d.getDate()+1))range.push(dateKey(d));arr=range}return arr}
function render(){SORTED_DATES=getVisibleDates();const teams=getVisibleTeams(),today=dateKey(new Date()),thead=document.getElementById('table-head'),tbody=document.getElementById('table-body');if(!TEAMS.length){thead.innerHTML='<tr><th>DATE</th></tr>';tbody.innerHTML='<tr><td class="p-8 text-slate-500" colspan="99">No teams selected. Open Teams to add one.</td></tr>';return}if(!SORTED_DATES.length){thead.innerHTML=`<tr><th>DATE</th>${teams.map(renderTeamHeader).join('')}</tr>`;tbody.innerHTML='<tr><td class="p-8 text-slate-500" colspan="99">No games match the current filters.</td></tr>';return}if(!IS_FLIPPED){thead.innerHTML=`<tr><th>DATE</th>${teams.map(renderTeamHeader).join('')}</tr>`;tbody.innerHTML=SORTED_DATES.map(date=>{const d=new Date(`${date}T12:00:00`),isToday=date===today;let html=`<tr id="row-${date}"><td class="${isToday?'today-highlight today-date':''} bg-slate-50"><div class="text-[8px] font-black text-blue-500">${d.toLocaleDateString('en-US',{weekday:'short'})}</div><div class="text-xs font-bold">${d.getDate()}</div><div class="text-[8px] text-slate-400 uppercase">${d.toLocaleDateString('en-US',{month:'short'})}</div></td>`;teams.forEach(t=>html+=renderCell(filterGames(SCHEDULES[teamKey(t)]?.[date]||[]),isToday));return html+'</tr>'}).join('')}else{thead.innerHTML=`<tr><th>TEAM</th>${SORTED_DATES.map(date=>{const d=new Date(`${date}T12:00:00`);return`<th id="col-${date}" class="${date===today?'today-highlight':''}"><div class="text-[9px] font-black text-blue-500">${d.toLocaleDateString('en-US',{weekday:'short'})}</div><div class="text-xs">${d.getDate()} ${d.toLocaleDateString('en-US',{month:'short'})}</div></th>`}).join('')}</tr>`;let rows='',lastLeague='';teams.forEach(t=>{if(GROUP_LEAGUES&&t.league!==lastLeague){rows+=`<tr class="league-divider"><td colspan="${SORTED_DATES.length+1}">${escapeHtml(leagueLabel(t.league))}</td></tr>`;lastLeague=t.league}rows+=`<tr><td class="bg-slate-50"><div class="team-head"><img src="${escapeAttr(t.logo)}" onerror="this.style.display='none'"><div class="team-head-label">${t.pinned?'★ ':''}${escapeHtml(t.abbr||t.name)}</div><div class="team-head-meta">${escapeHtml(leagueLabel(t.league))}</div></div></td>${SORTED_DATES.map(date=>renderCell(filterGames(SCHEDULES[teamKey(t)]?.[date]||[]),date===today)).join('')}</tr>`});tbody.innerHTML=rows}}
function filterGames(games){if(!UPCOMING_ONLY)return games;const now=Date.now();return games.filter(g=>!g.completed&&g.timestamp>=now-6*3600000)}
function renderTeamHeader(t){const idx=TEAMS.findIndex(x=>teamKey(x)===teamKey(t));return`<th title="${escapeAttr(t.name)}"><div class="team-head"><button class="remove-head" title="Remove ${escapeAttr(t.name)}" onclick="event.stopPropagation();removeTeamByIndex(${idx})">×</button><button class="pin ${t.pinned?'active':''}" title="${t.pinned?'Unpin':'Pin'} ${escapeAttr(t.name)}" onclick="event.stopPropagation();togglePin(${idx})">★</button><img src="${escapeAttr(t.logo)}" onerror="this.style.display='none'"><div class="team-head-label">${escapeHtml(t.abbr||t.name)}</div><div class="team-head-meta">${escapeHtml(leagueLabel(t.league))}</div></div></th>`}
function renderCell(games,isToday){if(!games.length)return`<td class="${isToday?'today-highlight':''}"><span class="text-slate-100 text-[4px]">.</span></td>`;const done=games.filter(g=>g.completed),allWins=done.length&&done.every(g=>g.result==='W'),allLosses=done.length&&done.every(g=>g.result==='L'),bg=allWins?'win-bg':allLosses?'loss-bg':isToday?'today-highlight':'';return`<td class="${bg}"><div class="game-content">${games.map((g,i)=>`${i?'<div class="game-divider"></div>':''}${renderGame(g)}`).join('')}</div></td>`}
function renderGame(g){const special=/postpon|cancel|delay|suspend/i.test(g.status),cls=g.state==='in'?'status-live':g.result==='W'?'status-win':g.result==='L'?'status-loss':special?'status-special':'',primary=g.completed?`${g.result||''} ${g.score}`.trim():g.state==='in'?g.score:special?g.status:g.time,secondary=g.state==='in'?g.status:(!g.completed&&!special?(g.network||g.status):''),payload=encodeURIComponent(JSON.stringify(g));return`<button class="game-button ${cls}" data-game="${payload}" onclick="openGameDetailsFromButton(this)"><div class="flex items-center justify-center gap-1"><span class="homeaway">${g.isAway?'AWAY':'HOME'}</span>${g.oppLogo?`<img src="${escapeAttr(g.oppLogo)}" class="w-5 h-5 object-contain" title="${escapeAttr(g.oppName)}">`:`<span class="text-[9px]">${escapeHtml(g.oppAbbr)}</span>`}</div><div class="font-black leading-tight mt-0.5">${escapeHtml(primary)}</div>${secondary?`<div class="text-[8px] opacity-70 max-w-[96px] mx-auto truncate">${escapeHtml(secondary)}</div>`:''}</button>`}
function openGameDetailsFromButton(btn){try{openGameDetails(JSON.parse(decodeURIComponent(btn.dataset.game)))}catch{}}
function openGameDetails(g){document.getElementById('game-title').textContent=`${g.teamName} ${g.isAway?'at':'vs'} ${g.oppName}`;document.getElementById('game-subtitle').textContent=`${g.date} · ${g.time} · ${leagueLabel(g.league)}`;const rows=[['Status',g.completed?`${g.result||''} ${g.score}`.trim():(g.state==='in'?`${g.score} · ${g.status}`:g.status||'Scheduled')],['Home/Away',g.isAway?'Away':'Home'],['TV / Network',g.network||'—'],['Venue',g.venue||'—'],['Location',g.address||'—'],['Attendance',g.attendance?Number(g.attendance).toLocaleString():'—'],['Notes',g.notes||'—']];document.getElementById('game-details').innerHTML=`<dl class="details-grid">${rows.map(([k,v])=>`<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('')}</dl>${g.link?`<a href="${escapeAttr(g.link)}" target="_blank" rel="noopener" class="mt-4 block text-center bg-slate-900 text-white rounded-lg py-2 text-sm font-bold">Open ESPN game page ↗</a>`:''}`;document.getElementById('game-modal').classList.remove('hidden')}
function closeGameDetails(){document.getElementById('game-modal').classList.add('hidden')}
function renderWindowFilters(){document.getElementById('window-filters').innerHTML=WINDOWS.map(w=>`<button onclick="setDateWindow('${w.id}')" class="filter-chip ${DATE_WINDOW===w.id?'active':''}">${w.label}</button>`).join('')}
function setDateWindow(id){DATE_WINDOW=id;localStorage.setItem('sports_date_window',id);renderWindowFilters();render();setTimeout(scrollToToday,0)}
function toggleUpcomingOnly(){UPCOMING_ONLY=!UPCOMING_ONLY;localStorage.setItem('sports_upcoming_only',JSON.stringify(UPCOMING_ONLY));syncToggleButtons();render()}
function toggleLeagueGrouping(){GROUP_LEAGUES=!GROUP_LEAGUES;localStorage.setItem('sports_group_leagues',JSON.stringify(GROUP_LEAGUES));syncToggleButtons();render()}
function syncToggleButtons(){document.getElementById('upcoming-toggle').classList.toggle('active',UPCOMING_ONLY);document.getElementById('group-toggle').classList.toggle('active',GROUP_LEAGUES)}
function setDensity(value,save=true){DENSITY=value;document.body.classList.remove('density-compact','density-large');if(value==='compact')document.body.classList.add('density-compact');if(value==='large')document.body.classList.add('density-large');if(save)localStorage.setItem('sports_density',value);render()}
function leagueLabel(league){return LEAGUES.find(x=>x.l===league)?.label||league.toUpperCase()}
function renderLeagueChips(){document.getElementById('league-chips').innerHTML=LEAGUES.map(m=>`<button class="league-chip ${m.l===ACTIVE_LEAGUE?'active':''}" onclick="setActiveLeague('${m.l}')">${m.label}</button>`).join('')}
function setActiveLeague(league){ACTIVE_LEAGUE=league;renderLeagueChips();const q=document.getElementById('search-input').value.trim();if(q)searchTeams();else{document.getElementById('search-results').innerHTML='';document.getElementById('search-status').textContent=''}}
function renderQuickAdd(){document.getElementById('quick-add').innerHTML=QUICK_TEAMS.map(t=>{const added=isTeamAdded(t);return`<button onclick='toggleQuickTeam(${JSON.stringify(JSON.stringify(t))})' class="border rounded-lg p-2 text-left hover:bg-slate-50 ${added?'bg-green-50 border-green-200':''}"><div class="flex items-center gap-2"><img src="${escapeAttr(t.logo)}" class="w-7 h-7 object-contain"><div><div class="text-xs font-bold">${escapeHtml(t.name)}</div><div class="text-[9px] ${added?'text-green-700':'text-slate-400'} font-bold">${added?'✓ ADDED':'+ ADD'} · ${escapeHtml(t.league.toUpperCase())}</div></div></div></button>`}).join('')}
function toggleQuickTeam(json){const t=JSON.parse(json);if(isTeamAdded(t)){const i=TEAMS.findIndex(x=>teamKey(x)===teamKey(t));if(i>=0)removeTeamByIndex(i)}else addTeam(t)}
function debouncedSearch(){clearTimeout(SEARCH_TIMER);SEARCH_TIMER=setTimeout(searchTeams,250)}
async function getLeagueTeams(meta){if(TEAM_CACHE.has(meta.l))return TEAM_CACHE.get(meta.l);const limit=meta.l.includes('college')?2000:500,data=await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${meta.s}/${meta.l}/teams?limit=${limit}`),raw=data?.sports?.[0]?.leagues?.[0]?.teams||data?.data?.sports?.[0]?.leagues?.[0]?.teams||[],teams=raw.map(item=>item?.team||item).filter(Boolean).map(t=>normalizeTeam({id:t.id,name:t.shortDisplayName||t.displayName||t.name,abbr:t.abbreviation||'',league:meta.l,sport:meta.s,logo:t.logos?.[0]?.href||''})).filter(Boolean);TEAM_CACHE.set(meta.l,teams);return teams}
async function searchTeams(){const q=document.getElementById('search-input').value.trim().toLowerCase(),box=document.getElementById('search-results'),status=document.getElementById('search-status');if(!q){box.innerHTML='';status.textContent='';LAST_SEARCH_RESULTS=[];return}const meta=LEAGUES.find(x=>x.l===ACTIVE_LEAGUE);if(!meta)return;const token=++SEARCH_TOKEN;status.textContent=`Searching ${meta.label}…`;box.innerHTML='<div class="p-4 text-center text-xs font-bold text-slate-400 uppercase tracking-widest">Searching...</div>';try{const teams=await getLeagueTeams(meta);if(token!==SEARCH_TOKEN)return;const hits=teams.filter(t=>`${t.name} ${t.abbr}`.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,100);LAST_SEARCH_RESULTS=hits;status.textContent=`${hits.length} result${hits.length===1?'':'s'} in ${meta.label}`;renderSearchResults()}catch(err){if(token!==SEARCH_TOKEN)return;status.textContent='Search failed';box.innerHTML=`<div class="p-4 text-center text-xs text-red-600">Could not load ${escapeHtml(meta.label)} teams. ${escapeHtml(err.message||'Try again.')}</div>`}}
function renderSearchResults(){const box=document.getElementById('search-results'),meta=LEAGUES.find(x=>x.l===ACTIVE_LEAGUE);box.innerHTML=LAST_SEARCH_RESULTS.map(t=>{const added=isTeamAdded(t);return`<button class="w-full flex justify-between items-center p-2 hover:bg-slate-50 text-left ${added?'bg-green-50':''}" data-team="${encodeURIComponent(JSON.stringify(t))}" onclick="addTeamFromButton(this)"><span class="flex items-center gap-2 min-w-0"><img src="${escapeAttr(t.logo)}" class="w-6 h-6 object-contain flex-shrink-0" onerror="this.style.display='none'"><span class="min-w-0"><span class="block text-sm font-semibold truncate">${escapeHtml(t.name)}</span><small class="text-slate-400 uppercase">${escapeHtml(t.abbr||meta?.label||'')}</small></span></span><span class="${added?'text-green-700':'text-blue-600'} text-xs font-bold flex-shrink-0">${added?'✓ ADDED':'+ ADD'}</span></button>`}).join('')||'<div class="p-4 text-center text-xs text-slate-400">No teams found</div>'}
function addTeamFromButton(b){const t=JSON.parse(decodeURIComponent(b.dataset.team));if(!isTeamAdded(t))addTeam(t)}
function isTeamAdded(t){return TEAMS.some(x=>teamKey(x)===teamKey(t))}
async function addTeam(team){const t=normalizeTeam(team);if(!t||isTeamAdded(t))return;TEAMS.push(t);saveTeams();renderTeamList();renderQuickAdd();renderSearchResults();render();setInlineStatus(`Adding ${t.name} schedule…`,'info');try{SCHEDULES[teamKey(t)]=await fetchSchedule(t);LOAD_ERRORS=LOAD_ERRORS.filter(x=>!x.startsWith(`${t.name}:`));setInlineStatus(`${t.name} added.`,'success')}catch(err){SCHEDULES[teamKey(t)]={};LOAD_ERRORS.push(`${t.name}: ${err.message||'schedule failed'}`);setInlineStatus(`${t.name} added, but its schedule could not load.`,'warn')}LAST_UPDATED=new Date();updateLastUpdated();render();showStatus();setTimeout(scrollToToday,100)}
function removeTeamByIndex(i){if(i<0||i>=TEAMS.length)return;const[removed]=TEAMS.splice(i,1);delete SCHEDULES[teamKey(removed)];LOAD_ERRORS=LOAD_ERRORS.filter(x=>!x.startsWith(`${removed.name}:`));saveTeams();renderTeamList();renderQuickAdd();renderSearchResults();render();showStatus()}
function togglePin(i){if(i<0||i>=TEAMS.length)return;TEAMS[i].pinned=!TEAMS[i].pinned;saveTeams();renderTeamList();render()}
function resetDefaultTeams(){TEAMS=DEFAULT_TEAMS.map(t=>({...t,pinned:false}));SCHEDULES={};saveTeams();renderTeamList();renderQuickAdd();closeModal();location.reload()}
function renderTeamList(){document.getElementById('team-list').innerHTML=TEAMS.map((t,i)=>`<li draggable="true" ondragstart="dragStart(${i},event)" ondragover="dragOver(event)" ondrop="dropTeam(${i},event)" ondragend="dragEnd(event)" class="team-row flex justify-between items-center bg-white p-2 border rounded shadow-sm"><div class="flex items-center gap-2 min-w-0"><span class="drag-handle" title="Drag to reorder">⋮⋮</span><button onclick="togglePin(${i})" class="pin ${t.pinned?'active':''}" title="${t.pinned?'Unpin':'Pin'}">★</button><img src="${escapeAttr(t.logo)}" class="w-7 h-7 object-contain flex-shrink-0" onerror="this.style.display='none'"><span class="min-w-0"><span class="font-semibold block truncate">${escapeHtml(t.name)}</span><small class="text-slate-400 uppercase">${escapeHtml(leagueLabel(t.league))}${t.abbr?` · ${escapeHtml(t.abbr)}`:''}</small></span></div><div class="flex items-center gap-1"><button onclick="moveTeam(${i},-1)" class="px-2 py-1 text-slate-400 hover:text-slate-800">←</button><button onclick="moveTeam(${i},1)" class="px-2 py-1 text-slate-400 hover:text-slate-800">→</button><button onclick="removeTeamByIndex(${i})" class="px-2 py-1 text-red-500 text-xs font-bold">REMOVE</button></div></li>`).join('')||'<li class="text-sm text-slate-400 p-3 border rounded">No teams selected.</li>'}
function moveTeam(i,delta){const j=i+delta;if(j<0||j>=TEAMS.length)return;[TEAMS[i],TEAMS[j]]=[TEAMS[j],TEAMS[i]];saveTeams();renderTeamList();render()}
function dragStart(i,event){DRAG_INDEX=i;event.currentTarget.classList.add('dragging');event.dataTransfer.effectAllowed='move'}
function dragOver(event){event.preventDefault();event.dataTransfer.dropEffect='move'}
function dropTeam(target,event){event.preventDefault();if(DRAG_INDEX==null||DRAG_INDEX===target)return;const[item]=TEAMS.splice(DRAG_INDEX,1);TEAMS.splice(target,0,item);DRAG_INDEX=null;saveTeams();renderTeamList();render()}
function dragEnd(event){event.currentTarget.classList.remove('dragging');DRAG_INDEX=null}
function setInlineStatus(message,type='info'){const bar=document.getElementById('status-bar'),classes={info:'bg-blue-50 text-blue-800 border-blue-200',success:'bg-green-50 text-green-800 border-green-200',warn:'bg-amber-50 text-amber-800 border-amber-200'};bar.className=`px-3 py-2 text-xs font-semibold border-b ${classes[type]||classes.info}`;bar.textContent=message;bar.classList.remove('hidden');if(type==='success')setTimeout(()=>{if(bar.textContent===message)bar.classList.add('hidden')},1800)}
function openModal(){document.getElementById('manage-modal').classList.remove('hidden');renderTeamList();renderQuickAdd();renderLeagueChips();setTimeout(()=>document.getElementById('search-input').focus(),50)}
function closeModal(){document.getElementById('manage-modal').classList.add('hidden')}
function toggleFlip(){IS_FLIPPED=!IS_FLIPPED;render();setTimeout(scrollToToday,0)}
function toggleHideEmpty(){HIDE_EMPTY=!HIDE_EMPTY;localStorage.setItem('hide_empty',JSON.stringify(HIDE_EMPTY));document.getElementById('hide-label').textContent=HIDE_EMPTY?'SHOW ALL DATES':'HIDE EMPTY DATES';render();setTimeout(scrollToToday,0)}
function scrollToToday(){const today=dateKey(new Date()),c=document.getElementById('table-container'),fallback=SORTED_DATES.find(d=>d>=today)||SORTED_DATES.at(-1),target=document.getElementById(IS_FLIPPED?`col-${today}`:`row-${today}`)||document.getElementById(IS_FLIPPED?`col-${fallback}`:`row-${fallback}`);if(target){if(IS_FLIPPED)c.scrollLeft=Math.max(0,target.offsetLeft-80);else c.scrollTop=Math.max(0,target.offsetTop-80)}}
function escapeHtml(v=''){return String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function escapeAttr(v=''){return escapeHtml(v)}
window.addEventListener('load',init);
</script>
</body>
</html>
